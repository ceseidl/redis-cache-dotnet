name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --nologo

      - name: Smoke test (cache-aside against Redis)
        run: |
          out=$(timeout 120 dotnet run --no-build --project src/RedisCache)
          echo "$out"
          echo "$out" | grep -E '^sem cache +100 leituras +100 consultas'
          echo "$out" | grep -E '^com cache +100 leituras +1 consulta'
          echo "$out" | grep -E '^após o TTL +1 leitura +1 consulta$'
          echo "$out" | grep -E '^sem invalidar: papéis = leitor$'
          echo "$out" | grep -E '^invalidando: +papéis = admin$'
